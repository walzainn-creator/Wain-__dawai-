<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الإدارة - وين دواي؟</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script></head><body><main class="container"><section class="card"><h1>دخول الإدارة</h1><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><p id="msg"></p></section></main><script>const c=window.WINDAWAI_CONFIG,sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return msg.textContent=error.message;location.href="admin.html"}</script></body></html>
