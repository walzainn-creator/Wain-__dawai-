<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة الصيدلي - وين دواي؟</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script></head><body><main class="container"><section class="card"><h1>بوابة الصيدلي</h1><p>سجّل الدخول بحساب الصيدلية ثم حدّث توفر الأدوية والسعر.</p><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><p id="msg"></p></section><section id="panel" class="card hidden"><h2>تحديث المخزون</h2><div id="inventory"></div></section></main><script>const c=window.WINDAWAI_CONFIG,sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);let pharmacyId;async function login(){let r=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(r.error)return msg.textContent=r.error.message;let {data}=await sb.from("pharmacy_staff").select("pharmacy_id").eq("user_id",r.data.user.id).maybeSingle();if(!data)return msg.textContent="الحساب غير مرتبط بصيدلية.";pharmacyId=data.pharmacy_id;panel.classList.remove("hidden");load()}async function load(){let {data}=await sb.from("drugs").select("id,name_ar").eq("active",true).order("name_ar").limit(500);let {data:inv}=await sb.from("pharmacy_inventory").select("*").eq("pharmacy_id",pharmacyId);let m=Object.fromEntries((inv||[]).map(x=>[x.drug_id,x]));inventory.innerHTML=(data||[]).map(d=>{let x=m[d.id]||{};return `<div class="result"><b>${d.name_ar}</b><select id="a-${d.id}"><option value="false" ${x.available===false?"selected":""}>غير متوفر</option><option value="true" ${x.available===true?"selected":""}>متوفر</option></select><input id="p-${d.id}" type="number" min="0" placeholder="السعر" value="${x.price??""}"><input id="n-${d.id}" placeholder="موعد التوفر إن لم يكن متوفراً" value="${x.next_available_at??""}"><button onclick="save('${d.id}')">حفظ</button></div>`}).join("")}async function save(id){let o={pharmacy_id:pharmacyId,drug_id:id,available:document.getElementById("a-"+id).value==="true",price:document.getElementById("p-"+id).value?Number(document.getElementById("p-"+id).value):null,next_available_at:document.getElementById("n-"+id).value||null};let r=await sb.from("pharmacy_inventory").upsert(o,{onConflict:"pharmacy_id,drug_id"});if(r.error)alert(r.error.message);else alert("تم الحفظ")}</script></body></html>
